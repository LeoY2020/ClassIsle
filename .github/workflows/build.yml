name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [ x64 ]
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild (Visual Studio)
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: dotnet restore ClassIsle.csproj -p:Platform=${{ matrix.platform }}

    - name: Publish (self-contained, WASDK embedded, no 1.x/2.x runtime needed)
      shell: pwsh
      run: |
        $vs = & vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
        $dll = Get-ChildItem "$vs\MSBuild" -Recurse -Filter Microsoft.Build.Packaging.Pri.Tasks.dll -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        if (-not $dll) { throw "Microsoft.Build.Packaging.Pri.Tasks.dll not found under VS MSBuild ($vs)" }
        $priPath = Split-Path $dll
        dotnet publish ClassIsle.csproj -c Release -r win-${{ matrix.platform }} --self-contained true -p:Platform=${{ matrix.platform }} -p:PublishSingleFile=false -o publish "/p:AppxMSBuildToolsPath=$priPath\"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ClassIsle-win-${{ matrix.platform }}
        path: publish
